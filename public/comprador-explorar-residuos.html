<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Eco Connect | Explorar residuos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Estilos globales -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Estilos específicos para la vista comprador -->
  <style>
    .page-hero {
      max-width: 960px;
      margin: 40px auto 24px;
      padding: 0 16px;
    }
    .page-hero h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }
    .page-hero p {
      color: #4b5563;
      max-width: 640px;
      font-size: 0.98rem;
    }

    .filters {
      max-width: 960px;
      margin: 0 auto 16px;
      padding: 0 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }
    .filters .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1 1 200px;
      min-width: 200px;
    }
    .filters label {
      font-size: 0.85rem;
      color: #4b5563;
    }
    .filters input {
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      font-size: 0.9rem;
    }

    .list-status {
      max-width: 960px;
      margin: 8px auto 0;
      padding: 0 16px;
      font-size: 0.9rem;
      color: #6b7280;
    }

    .residuos-list {
      max-width: 1100px;
      margin: 16px auto 40px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .residuo-item {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px 16px 18px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      border: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .residuo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .residuo-badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-sin-procesar {
      background: #fef3c7;
      color: #92400e;
    }
    .badge-procesado {
      background: #dcfce7;
      color: #166534;
    }

    .residuo-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .residuo-meta {
      font-size: 0.85rem;
      color: #6b7280;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
    }

    .residuo-descripcion {
      font-size: 0.85rem;
      color: #4b5563;
    }

    .residuo-fotos {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .residuo-fotos img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
    }

    .residuo-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .residuo-actions .btn-secondary {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .residuo-actions .btn-primary {
      padding: 6px 12px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .empty-state {
      max-width: 640px;
      margin: 40px auto;
      padding: 20px 24px;
      border-radius: 16px;
      background: #f9fafb;
      border: 1px dashed #d1d5db;
      text-align: center;
      font-size: 0.95rem;
      color: #4b5563;
    }
  </style>
</head>
<body>


  <main>
    <section class="page-hero">
      <h1>Explorar residuos disponibles</h1>
      <p>
        Descubre los residuos que otras empresas tienen disponibles para venta o reaprovechamiento.
        Filtra por tipo y ubicación para encontrar lo que necesitas.
      </p>
    </section>

    <section class="filters">
      <div class="form-group">
        <label for="filtro-tipo">Tipo de residuo</label>
        <input type="text" id="filtro-tipo" placeholder="Ej. plástico, metal" />
      </div>
      <div class="form-group">
        <label for="filtro-ubicacion">Ubicación</label>
        <input type="text" id="filtro-ubicacion" placeholder="Ciudad o estado" />
      </div>
      <button id="btn-aplicar-filtros" class="btn btn-outline">Aplicar filtros</button>
    </section>

    <p id="status-explorar-residuos" class="list-status"></p>

    <section id="lista-residuos" class="residuos-list">
      <!-- Cards vía JS -->
    </section>

    <div id="empty-state" class="empty-state" style="display: none;">
      No encontramos residuos disponibles con esos filtros.
      <br />
      Intenta cambiar el tipo de residuo o la ubicación.
    </div>
  </main>

  <!-- Scripts -->
  <script type="module" src="js/pages/comprador-explorar-residuos.js"></script>
</body>
</html>
