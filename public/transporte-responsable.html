<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Transporte responsable | Eco Connect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fuentes: Anton (títulos) y Poppins (texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>


  <main class="section">
    <div class="container two-columns">
      <div>
        <h1 class="section-title">Cumple con transporte responsable</h1>
        <p class="section-text">
          Documenta que tu servicio de transporte cumple con permisos, seguros y prácticas de manejo seguro de residuos.
        </p>
      </div>

      <form id="form-transporte-responsable" class="card form-card">
        <h3 class="card-title">Subir documentación</h3>

        <div class="form-group">
          <label for="docs-permisos">Permisos de transporte de residuos</label>
          <input type="file" id="docs-permisos" multiple />
        </div>

        <div class="form-group">
          <label for="docs-certificaciones">Certificaciones ambientales</label>
          <input type="file" id="docs-certificaciones" multiple />
        </div>

        <div class="form-group">
          <label for="docs-seguros">Seguros o autorizaciones</label>
          <input type="file" id="docs-seguros" multiple />
        </div>

        <h3 class="card-title">Prácticas de transporte</h3>

        <div class="form-group">
          <label for="practicas-manejo">Manejo seguro de residuos</label>
          <textarea id="practicas-manejo" rows="3" placeholder="Describe cómo manejas los residuos durante el transporte."></textarea>
        </div>

        <div class="form-group">
          <label for="practicas-regulaciones">Cumplimiento de regulaciones ambientales</label>
          <textarea id="practicas-regulaciones" rows="3" placeholder="Explica qué normativas cumples y cómo las atiendes."></textarea>
        </div>

        <div class="form-group">
          <label for="practicas-procedimientos">Procedimientos de transporte</label>
          <textarea id="practicas-procedimientos" rows="3" placeholder="Describe tus procedimientos de carga, descarga y rutas."></textarea>
        </div>

<!-- NUEVO: seleccionar servicio -->
        <div class="form-group">
          <label for="servicio-transporte-select">Selecciona el servicio de transporte</label>
          <select id="servicio-transporte-select" required>
            <option value="">Elige uno de tus servicios publicados...</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary full-width">Subir documentación</button>
        <p id="status-transporte-responsable" class="form-status"></p>
      </form>
    </div>
  </main>


  <!-- Scripts -->
  <script type="module" src="js/pages/transporte-responsable.js"></script>


</body>
</html>
