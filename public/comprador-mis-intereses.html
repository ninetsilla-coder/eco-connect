<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Eco Connect | Mis intereses</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Estilos globales -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Estilos específicos -->
  <style>
    .page-hero {
      max-width: 960px;
      margin: 40px auto 24px;
      padding: 0 16px;
    }
    .page-hero h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }
    .page-hero p {
      color: #4b5563;
      max-width: 640px;
      font-size: 0.98rem;
    }

    .list-status {
      max-width: 960px;
      margin: 8px auto 0;
      padding: 0 16px;
      font-size: 0.9rem;
      color: #6b7280;
    }

    .intereses-list {
      max-width: 1100px;
      margin: 16px auto 40px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .interes-item {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px 16px 18px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      border: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .interes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .interes-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .interes-badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      background: #eff6ff;
      color: #1d4ed8;
    }

    .interes-meta {
      font-size: 0.85rem;
      color: #6b7280;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
    }

    .interes-descripcion {
      font-size: 0.85rem;
      color: #4b5563;
    }

    .interes-fotos {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .interes-fotos img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
    }

    .interes-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-secondary {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .btn-danger {
      padding: 6px 10px;
      border-radius: 999px;
      border: none;
      background: #ef4444;
      color: #fff;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .empty-state {
      max-width: 640px;
      margin: 40px auto;
      padding: 20px 24px;
      border-radius: 16px;
      background: #f9fafb;
      border: 1px dashed #d1d5db;
      text-align: center;
      font-size: 0.95rem;
      color: #4b5563;
    }
  </style>
</head>
<body>


  <main>
    <section class="page-hero">
      <h1>Mis intereses</h1>
      <p>
        Aquí verás los residuos que has guardado como interés. Desde esta sección puedes revisarlos de nuevo o eliminarlos de tu lista.
      </p>
    </section>

    <p id="intereses-status" class="list-status"></p>

    <section id="intereses-list" class="intereses-list">
      <!-- Cards vía JS -->
    </section>

    <div id="intereses-empty" class="empty-state" style="display: none;">
      Todavía no has guardado ningún residuo en tus intereses.
      <br />
      Puedes explorar opciones en <a href="comprador-explorar-residuos.html">Explorar residuos</a>.
    </div>
  </main>

  <!-- Scripts -->
  <script type="module" src="js/pages/comprador-mis-intereses.js"></script>

</body>
</html>
