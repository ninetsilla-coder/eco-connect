<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Publicar servicio de transporte | Eco Connect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fuentes: Anton (títulos) y Poppins (texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>


  <main class="section">
    <div class="container form-container">
      <div>
        <h1 class="section-title">Publicar servicio de transporte</h1>
        <p class="section-text">
          Registra un servicio de transporte disponible para mover residuos valorizables dentro de la red EcoConnect.
        </p>
      </div>

      <form id="form-servicio-transporte" class="card form-card">
        <div class="form-group">
          <label for="tipo-transporte">Tipo de transporte *</label>
          <input type="text" id="tipo-transporte" required placeholder="Ej. Camión de volteo, camioneta 3.5 t, transporte especializado" />
        </div>

        <div class="form-group">
          <label for="capacidad-carga">Capacidad de carga *</label>
          <input type="text" id="capacidad-carga" required placeholder="Ej. 3 toneladas, 10 toneladas" />
        </div>

        <div class="form-group">
          <label for="tipos-residuos">Tipos de residuos que puedes transportar *</label>
          <input type="text" id="tipos-residuos" required placeholder="Plástico, cartón, metal, residuos industriales, etc." />
        </div>

        <div class="form-group">
          <label for="zona-cobertura">Zona de cobertura *</label>
          <input type="text" id="zona-cobertura" required placeholder="Ciudad, estado o región" />
        </div>

        <div class="form-group">
          <label for="disponibilidad">Disponibilidad o frecuencia *</label>
          <input type="text" id="disponibilidad" required placeholder="Diaria, semanal, bajo solicitud, etc." />
        </div>

        <div class="form-group">
          <label for="descripcion">Descripción adicional</label>
          <textarea id="descripcion" rows="4" placeholder="Condiciones del servicio, requisitos, tipo de carga, restricciones, etc."></textarea>
        </div>

        <div class="form-group">
          <label for="fotos-vehiculo">Fotos del vehículo (opcional)</label>
          <input type="file" id="fotos-vehiculo" multiple accept="image/*"/>
          <p class="form-helper-text">Puedes subir una o varias fotos del vehículo para que las empresas lo conozcan mejor.</p>
        </div>

        <button type="submit" class="btn btn-primary full-width">Publicar servicio</button>
        <p id="status-servicio-transporte" class="form-status"></p>
      </form>
    </div>
  </main>


  <!-- Scripts -->
  <script type="module" src="js/pages/publicar-servicio-transporte.js"></script>


</body>
</html>
