<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Eco Connect | Detalle del residuo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Estilos globales -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Estilos específicos -->
  <style>
    .detalle-wrapper {
      max-width: 960px;
      margin: 40px auto;
      padding: 0 16px 40px;
    }

    .detalle-header {
      margin-bottom: 16px;
    }

    .detalle-header h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
    }

    .detalle-header p {
      color: #4b5563;
      font-size: 0.95rem;
    }

    .detalle-layout {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1.3fr);
      gap: 24px;
    }

    @media (max-width: 900px) {
      .detalle-layout {
        grid-template-columns: 1fr;
      }
    }

    .detalle-fotos {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .detalle-fotos img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
    }

    .detalle-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      border: 1px solid #e5e7eb;
    }

    .detalle-meta {
      font-size: 0.9rem;
      color: #4b5563;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px 16px;
      margin-bottom: 12px;
    }

    .detalle-meta span strong {
      font-weight: 600;
      color: #111827;
    }

    .detalle-descripcion {
      font-size: 0.9rem;
      color: #4b5563;
      margin-top: 8px;
    }

    .detalle-actions {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn-outline {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      background: #fff;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .btn-primary {
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .detalle-side {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .detalle-side-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      border: 1px solid #e5e7eb;
      font-size: 0.9rem;
      color: #4b5563;
    }

    .detalle-side-card h3 {
      font-size: 1rem;
      margin-bottom: 6px;
      color: #111827;
    }

    .form-status {
      font-size: 0.9rem;
      margin-bottom: 8px;
      color: #6b7280;
    }

    .form-status.error {
      color: #b91c1c;
    }

    .form-status.success {
      color: #166534;
    }
  </style>
</head>
<body>


  <main>
    <div class="detalle-wrapper">
      <a href="comprador-explorar-residuos.html" class="btn-outline" style="margin-bottom: 12px;">&larr; Volver a explorar residuos</a>

      <div class="detalle-header">
        <h1>Detalle del residuo</h1>
        <p>Consulta la información completa de este residuo antes de mostrar interés o contactar al generador.</p>
      </div>

      <p id="status-detalle-residuo" class="form-status"></p>

      <div id="detalle-layout" class="detalle-layout" style="display:none;">
        <section class="detalle-card" id="detalle-main">
          <!-- Se rellena con JS -->
        </section>

        <aside class="detalle-side">
          <div class="detalle-side-card" id="detalle-acciones">
            <h3>Acciones</h3>
            <p>Puedes contactar al generador o guardar este residuo en tu lista de intereses.</p>
            <div class="detalle-actions">
              <button id="btn-contactar" class="btn-outline">Contactar generador</button>
              <button id="btn-guardar-interes" class="btn-primary">Guardar en mis intereses</button>
            </div>
            <p id="mensaje-interes" class="form-status"></p>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script type="module" src="js/pages/comprador-detalle-residuo.js"></script>
</body>
</html>
