<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Eco Connect | Pago de la operación</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fuentes: Anton (títulos) y Poppins (texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Estilos globales -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Estilos específicos de esta página -->
  <style>
    .page-hero {
      max-width: 820px;
      margin: 40px auto 8px;
      padding: 0 16px;
    }

    .page-hero h1 { font-size: 2rem; margin-bottom: 8px; }
    .page-hero p  { color: #4b5563; font-size: 0.98rem; }

    .pago-layout {
      max-width: 820px;
      margin: 0 auto 48px;
      padding: 0 16px;
    }

    .tarjeta {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 20px 24px;
      margin-top: 18px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05);
    }

    .tarjeta h2 { font-size: 1.05rem; margin-bottom: 10px; }

    .desglose { width: 100%; border-collapse: collapse; }

    .desglose td {
      padding: 9px 0;
      font-size: 0.93rem;
      border-bottom: 1px solid #f3f4f6;
    }

    .desglose td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
    .desglose tr:last-child td { border-bottom: none; font-weight: 700; font-size: 1.05rem; }
    .desglose .concepto-detalle { display: block; font-size: 0.8rem; color: #6b7280; }

    .clabe {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      font-variant-numeric: tabular-nums;
      word-break: break-all;
      margin: 6px 0 4px;
    }

    .paso {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 10px 0;
      border-bottom: 1px solid #f3f4f6;
    }

    .paso:last-child { border-bottom: none; }

    .paso-marca {
      flex: 0 0 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #d1d5db;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: #ffffff;
    }

    .paso-hecho .paso-marca { background: #16a34a; border-color: #16a34a; }
    .paso-hecho .paso-texto strong { color: #166534; }

    .paso-texto strong { display: block; font-size: 0.93rem; }
    .paso-texto span   { font-size: 0.83rem; color: #6b7280; }

    @media (max-width: 640px) {
      .page-hero h1 { font-size: 1.6rem; }
      .clabe { font-size: 1.15rem; }
    }
  </style>
</head>
<body>

  <main>
    <section class="page-hero">
      <h1>Pago de la operación</h1>
      <p id="pago-resumen">Cargando...</p>
    </section>

    <section class="pago-layout">
      <div class="tarjeta">
        <h2>Qué estás pagando</h2>
        <table class="desglose">
          <tbody id="desglose"></tbody>
        </table>
      </div>

      <div class="tarjeta">
        <h2>Transfiere por SPEI a esta CLABE</h2>
        <p class="clabe" id="clabe">—</p>
        <p class="form-hint">
          Transfiere el monto exacto a esta CLABE. Tu pago se confirma en unos 30 minutos
          en días hábiles.
        </p>
        <p class="section-note" id="aviso-clabe"></p>
      </div>

      <div class="tarjeta">
        <h2>Estado del pago</h2>
        <div id="pasos-pago"></div>
        <div class="documento-acciones" style="margin-top: 14px;">
          <button type="button" id="btn-simular" class="btn btn-primary">Simular pago recibido</button>
          <a href="manifiesto.html" id="enlace-manifiesto" class="btn btn-outline" style="display: none;">
            Ver el manifiesto
          </a>
        </div>
        <p class="form-status" id="estado-pago" role="status" aria-live="polite"></p>
      </div>

      <p class="section-note" id="aviso-simulacion"></p>
    </section>
  </main>

  <script type="module" src="js/pages/pago.js"></script>
</body>
</html>
