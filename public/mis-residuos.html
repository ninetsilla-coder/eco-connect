<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Eco Connect | Mis residuos publicados</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Estilos globales -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Estilos específicos -->
  <style>
    .page-hero {
      max-width: 960px;
      margin: 40px auto 24px;
      padding: 0 16px;
    }
    .page-hero h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }
    .page-hero p {
      color: #4b5563;
      max-width: 640px;
      font-size: 0.98rem;
    }

    .residuos-list {
      max-width: 1100px;
      margin: 24px auto 40px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .residuo-item {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px 16px 18px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      border: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .residuo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .residuo-badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-sin-procesar {
      background: #fef3c7;
      color: #92400e;
    }
    .badge-procesado {
      background: #dcfce7;
      color: #166534;
    }

    .residuo-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .residuo-meta {
      font-size: 0.85rem;
      color: #6b7280;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
    }

    .residuo-descripcion {
      font-size: 0.85rem;
      color: #4b5563;
    }

    .residuo-fotos {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .residuo-fotos img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
    }

    .empty-state {
      max-width: 640px;
      margin: 40px auto;
      padding: 20px 24px;
      border-radius: 16px;
      background: #f9fafb;
      border: 1px dashed #d1d5db;
      text-align: center;
      font-size: 0.95rem;
      color: #4b5563;
    }

    .empty-state a {
      color: #16a34a;
      font-weight: 600;
      text-decoration: none;
    }

    .list-status {
      max-width: 960px;
      margin: 16px auto 0;
      padding: 0 16px;
      font-size: 0.9rem;
      color: #6b7280;
    }

    .residuo-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .residuo-actions-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .residuo-actions .btn-secondary {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      background: #f9fafb;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .residuo-actions .btn-primary {
      padding: 6px 12px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #fff;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* Insignia de amparo: si tu registro cubre ese material. */
    .badge-gestion {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      background: #f3f4f6;
      color: #4b5563;
    }
    .badge-gestion.ok {
      background: #dcfce7;
      color: #166534;
    }
    .badge-gestion.parcial {
      background: #fef9c3;
      color: #854d0e;
    }
    .badge-gestion.sin {
      background: #fee2e2;
      color: #b91c1c;
    }

    .badge-gestion a {
      color: inherit;
      text-decoration: underline;
      font-weight: 600;
      font-size: 0.72rem;
    }
  </style>
</head>
<body>


  <main>
    <section class="page-hero">
      <h1>Mis residuos publicados</h1>
      <p>
        Revisa todas las publicaciones de residuos que has creado, junto con su estado, ubicación y fotos de referencia.
      </p>
    </section>

    <p id="list-status" class="list-status"></p>

    <section id="residuos-list" class="residuos-list">
      <!-- Aquí se renderizan las cards vía JS -->
    </section>

    <div id="empty-state" class="empty-state" style="display: none;">
      Todavía no has publicado ningún residuo. 
      <br />
      <a href="publicar-residuos.html">Publica tu primer residuo aquí.</a>
    </div>
  </main>

  <!-- Scripts -->
  <script type="module" src="js/pages/mis-residuos.js"></script>
</body>
</html>
